name: product gate

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

# Python is a frozen compatibility reference and repository-hook runtime. The
# required product gate executes the authoritative Rust CLI, LSP, and WASM surfaces.

on:
  push:
    branches: [main]
  pull_request:
    # The agent-configuration exemption formerly lived here as a
    # `paths-ignore` list. It now lives in `tools/check-product-gate-scope.sh`,
    # run as the first step of each heavy job below, so a skip is an
    # in-job early exit that still reports a context instead of a
    # workflow-level skip that reports none at all. See docs/DESIGN-ci.md,
    # "Agent-configuration exemption".
  merge_group:
    # Unfiltered: GitHub does not support `paths`/`paths-ignore` on
    # `merge_group` (docs/DESIGN-ci.md), and only `main` could ever have a
    # queue, so an unfiltered trigger is equivalent. Dormant -- no merge
    # queue exists on `main`. One was configured on the `main` ruleset on
    # 2026-08-05 and removed the same day: every merge would have taken the
    # admin-bypass path, so the queue would never have validated anything --
    # measured, not predicted. Reviving it needs a human-review-policy
    # change, not a CI change, so this trigger stays inert rather than
    # removed. See docs/DESIGN-ci.md, "Required pre-merge contexts, and why
    # the merge queue was rejected" and its "The merge queue was tried,
    # measured against this repository's workflow, and rejected" subsection.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The Linux evidence — `rust workspace` and `WASM` — runs on every pull request
# today. It is where the tests live: 103 of the repository's 124 integration
# test files sit in `fslc`, `fsl-tools`, `fsl-verifier` and `fsl-lsp`, none of
# which the bounded `merge readiness` gate compiles or runs, and its
# `cargo check` carries no `--all-targets`, so a type error or a failing
# assertion in any of them used to reach main and surface only after the
# merge.
#
# The four heavy jobs (`rust-workspace`, `wasm`, `semantic-mutation`,
# `fsl-logic`) also trigger on `merge_group`, which stays inert: a merge
# queue was tried on the `main` ruleset on 2026-08-05 and rejected the same
# day, because an administrator's merge bypasses the queue entirely and the
# ordinary enqueue path is unsatisfiable under this repository's
# single-approver review policy. Reviving the queue would require changing
# that human review policy, not this workflow, so the trigger and
# `tools/check-product-gate-scope.sh`'s `queue-entry-stub` branch stay ready
# rather than removed. `pull_request` events run the complete evidence in
# full, exactly as before. See docs/DESIGN-ci.md, "Required pre-merge
# contexts, and why the merge queue was rejected" and its "The merge queue
# was tried, measured against this repository's workflow, and rejected"
# subsection.
#
# Only the cross-platform matrix — `native Z3 4.16` on macOS and Windows — stays
# post-merge under FSL_OPTIMISTIC_CI, reported by the post-merge CI reporter.
# That is where platform failures have actually occurred (Windows PATH and
# `core.autocrlf` line endings), and Windows is the slowest job in the gate, so
# deferring it is what buys the merge-throughput this split is for.
#
# Product gates for main pushes, schedules, manual runs, and production
# promotions never honor that opt-out.
concurrency:
  group: product-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `rust workspace` is split three ways (docs/DESIGN-ci.md, "Sharded
  # pre-merge Linux evidence"): `rust-checks` runs the non-test phases once
  # (formatting, Clippy, doctests -- which `cargo-nextest` cannot run, so
  # they stay here rather than being silently dropped -- and the full
  # workspace build), and `rust-tests` shards the ~29-minute sequential test
  # execution three ways with `cargo-nextest`. The `rust-workspace` job below
  # aggregates both under the exact required-context name and keeps its job
  # id unchanged, so `product-gate`'s `needs:` list and the `main` ruleset's
  # required-context set both keep working without any further edit.
  rust-checks:
    name: rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Check Rust workspace (non-test phases)
        if: steps.scope.outputs.run == 'true'
        run: ./tools/check-native-integration.sh rust-checks

  rust-tests:
    name: rust tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target
          shared-key: rust-workspace

      - name: Cache pinned cargo-nextest CLI
        id: nextest-cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-0.9.143

      - name: Install pinned cargo-nextest CLI
        if: steps.nextest-cache.outputs.cache-hit != 'true' && steps.scope.outputs.run == 'true'
        run: cargo install cargo-nextest --version 0.9.143 --locked

      - name: Run Rust test shard
        if: steps.scope.outputs.run == 'true'
        run: ./tools/check-native-integration.sh rust-tests ${{ matrix.shard }}/3

      - name: Preserve test-shard inventory
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/test-shards/*.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  rust-workspace:
    name: rust workspace
    if: always()
    needs:
      - rust-checks
      - rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - name: Require complete rust-checks and rust-tests evidence
        env:
          RUST_CHECKS: ${{ needs.rust-checks.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
        shell: bash
        run: |
          failures=0
          for result in "$RUST_CHECKS" "$RUST_TESTS"; do
            if [ "$result" != "success" ]; then
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "rust workspace failed: rust-checks=$RUST_CHECKS rust-tests=$RUST_TESTS" >&2
            exit 1
          fi

      # Agent-configuration-exempt pull requests never upload shard
      # inventories (the upload steps above are gated on the same scope
      # check), so there is nothing to download or validate: the shards
      # already reported `success` from their early exit, which the
      # previous step accepted.
      - name: Download rust test-shard inventories
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: rust-test-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust-test-shards

      - name: Verify shard completeness
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mapfile -t fulls < <(find rust-test-shards -name full.txt | sort)
          mapfile -t shards < <(find rust-test-shards -name shard.txt | sort)
          if [ "${#fulls[@]}" -ne 3 ] || [ "${#shards[@]}" -ne 3 ]; then
            echo "rust workspace: expected 3 shard inventories, found ${#fulls[@]} full.txt and ${#shards[@]} shard.txt" >&2
            exit 1
          fi
          # Three independently computed listings must agree exactly -- a
          # divergence means the shards did not see the same workspace.
          if ! cmp -s "${fulls[0]}" "${fulls[1]}" || ! cmp -s "${fulls[1]}" "${fulls[2]}"; then
            echo "rust workspace: the three shards computed different full test listings" >&2
            diff "${fulls[0]}" "${fulls[1]}" || true
            diff "${fulls[1]}" "${fulls[2]}" || true
            exit 1
          fi
          ./tools/check-shard-union.sh "${fulls[0]}" "${shards[@]}"

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rust/spikes/z3js-worker/package-lock.json
            rust/fsl-wasm/package-lock.json

      - name: Cache pinned wasm-bindgen CLI
        id: wasm-bindgen-cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.126

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true' && steps.scope.outputs.run == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Check WASM integration
        if: steps.scope.outputs.run == 'true'
        run: ./tools/check-native-integration.sh wasm

  rust-native-z3:
    name: native Z3 4.16 (${{ matrix.os }})
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      github.base_ref == 'production' ||
      vars.FSL_OPTIMISTIC_CI != 'enabled'
    runs-on: ${{ matrix.os }}
    # Raised rather than narrowed, for the same reason `production-native-z3-linux`
    # below gives: a gate that runs out of wall clock reports a failure it did not
    # observe. Warm measured: 32m56s / 32m45s (2026-08-04), 31m49s / 29m44s / 26m56s
    # (2026-08-05) -- comfortably inside the old 40-minute budget. The scheduled
    # `windows-latest` run then hit exactly 40m0x and was cancelled on every one of
    # six consecutive occasions from 2026-08-07 00:23 through 2026-08-11: a step
    # change, not gradual drift, and neither a regression nor added test volume. The
    # decisive contrast is the `Swatinem/rust-cache` restore step itself: the last
    # success (2026-08-05) reported `Cache hit for: v0-rust-rust-native-z3-Windows_NT-x64-...`
    # and restored 591 MiB; the 2026-08-11 cancellation reported `No cache found.`
    # instead. The cache had been evicted by pull-request-scoped caches this same
    # commit's other changes close off (see the `Swatinem/rust-cache` step below and
    # `merge-readiness.yml`). Run 31565897267 attempt 1 then ran cold from 05:14:37Z to
    # 06:16:23Z (61m46s) and was cancelled, so 60 minutes did not cover this cold
    # vendored-Z3 build at the current tree and test volume. A prior cold success,
    # run 30156566539 attempt 1 / job 89675360913, completed in 37m08s on 2026-07-25, but
    # that is a different tree and test volume. Its post step saved a cache, and
    # the next Windows run (31570480618 attempt 1) was warm and completed in 34m39s; this
    # is a recovery path, not evidence that the current tree has a successful
    # cold-build duration within 60 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is covered by the full rust-workspace test gate above.
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target
          # Run 31527197290 attempt 1's old 40-minute cold Windows job was cancelled and its
          # post step was skipped (`9 skipped Post Run Swatinem/rust-cache@v2`).
          # `cache-on-failure: true` enables rust-cache's non-success post-save path;
          # `post-if: success() || env.CACHE_ON_FAILURE == 'true'` is mechanism
          # evidence that it includes cancellation. Run 31565897267 attempt 1's cancelled
          # Windows job's step 9
          # (`Post Run Swatinem/rust-cache@v2`) succeeded and created
          # `v0-rust-rust-native-z3-Windows_NT-x64-af4551b0-09fbaf53` at
          # 2026-08-12T06:16:19.271024Z (619,429,238 B), four seconds before the
          # job completed. That changeset also raised the timeout from 40 to 60
          # minutes, so the observed post-save does not isolate either change's
          # contribution. Commit 877fe8c (#752) likewise paired the semantic-mutation
          # flag with timeout increases; see docs/DESIGN-ci.md, "Actions cache budget".
          cache-on-failure: true

      - name: Test pinned native solver and BMC crates
        working-directory: rust
        run: cargo test --locked -p fsl-solver-z3 -p fsl-verifier -p fslc-rust

  production-native-z3-linux:
    name: native Z3 4.16 (ubuntu-latest)
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    # Promotion-only, and always a cold build: this job runs on so few commits
    # that `Swatinem/rust-cache` reports "No cache found" every time, so the
    # budget must cover vendored Z3 plus the whole `fslc-rust` suite from
    # scratch. Measured cold: 32m43s at the v4.0.0 promotion, over 40m at the
    # v4.1.0 promotion once issue #537's suites landed -- the job was killed
    # mid-suite with every test that had run passing. Raised rather than
    # narrowed: the same `cargo test --locked` must still pass in full, and a
    # gate that runs out of wall clock reports a failure it did not observe.
    # Splitting or caching this job is tracked in issue #655.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target

      - name: Test pinned native solver and BMC crates
        working-directory: rust
        run: cargo test --locked -p fsl-solver-z3 -p fsl-verifier -p fslc-rust

  # M13 semantic mutation gate (#672), split into two lanes (docs/DESIGN-ci.md,
  # "Sharded pre-merge Linux evidence"). Pull requests run the complete
  # curated control matrix plus generic mutants intersecting their diff.
  # Push, schedule, and manual runs execute the complete accepted P2 pilot
  # scope. `semantic-mutation-operators` shards the curated fault-operator
  # controls three ways; `semantic-mutation-mutants` runs the generic
  # cargo-mutants half complete and unsharded, because it is already at
  # roughly the operator lane's floor and sharding it would add cargo-mutants
  # partitioning risk for no wall-clock gain. The `semantic-mutation` job
  # below aggregates both under the exact required-context name expression
  # and keeps its job id unchanged, so `product-gate`'s `needs:` list and the
  # `main` ruleset's required-context set both keep working without any
  # further edit.
  semantic-mutation-operators:
    name: mutation operators (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Saving is restricted to non-pull-request events. A pull request's cache is
          # readable only by that same pull request -- Actions caches are ref-scoped, so
          # sibling pull requests cannot use each other's -- while, at the time of the
          # 2026-08-06 incident, `ci.yml`'s four shared keys together stored about
          # 6.9 GiB per pull request against a 10 GiB repository limit. Two concurrent
          # pull requests therefore evicted `main`'s caches, after which every run built
          # cold: measured +8 to +16 min per shard. Save-enabled `ci.yml` steps save on
          # non-`pull_request` events, and every pull request can read `main` because it
          # is the default branch. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target
          shared-key: semantic-mutation
          # Under the old 30-minute budget, a cold operators run was cancelled at
          # 30.2 minutes and its post save was skipped. `cache-on-failure: true`
          # enables rust-cache's post-save path for a non-success outcome. Commit
          # 877fe8c simultaneously raised this timeout from 30 to 50 minutes, so
          # subsequent outcomes do not isolate either change's contribution. See
          # docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          cache-on-failure: true

      - name: Calibrate curated fault-operator shard
        if: steps.scope.outputs.run == 'true'
        run: ./tools/run-semantic-mutation-gate.sh "${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production')) && 'changed' || 'complete' }}" --lane operators --shard ${{ matrix.shard }}/3

      - name: Preserve operator shard evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-mutation-operators-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/fault-operators/logs/**
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  semantic-mutation-mutants:
    name: mutation mutants
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Restore-only: `save-if: false` makes this job unable to save the
          # `semantic-mutation` key, so the save-enabled operators shards are its
          # only configured saver. This is a behavior change, not a historical
          # inevitability: on run 31086907528 attempt 1, mutants job 92568586155
          # restored `No cache found.`, then its successful post step uploaded
          # 2,922,378,363 B while all three operators shards were cancelled and
          # their post steps skipped. This job's rust/target-scoped evidence
          # (`rust/target/semantic-mutation.*`, kept there solely because the
          # artifact-upload glob below requires it) must not enter a future cache
          # save. `cache-on-failure` is absent because `save-if: false` bypasses
          # the save path. See docs/DESIGN-ci.md, "Actions cache budget", and
          # issue #747.
          save-if: false
          workspaces: rust -> target
          shared-key: semantic-mutation

      - name: Install pinned semantic mutation runner
        if: steps.scope.outputs.run == 'true'
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Build change diff
        if: steps.scope.outputs.run == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        # cargo-mutants runs at rust/ and matches patch paths relative to that
        # workspace; --relative prevents a silent rust/ prefix mismatch.
        run: git diff --relative=rust --binary "$BASE_SHA...$HEAD_SHA" -- rust >"$RUNNER_TEMP/semantic-mutation.diff"

      - name: Calibrate changed implementation semantics
        if: steps.scope.outputs.run == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production'))
        env:
          FSL_MUTATION_DIFF: ${{ runner.temp }}/semantic-mutation.diff
          FSL_MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: ./tools/run-semantic-mutation-gate.sh changed --lane mutants

      - name: Calibrate complete accepted implementation scope
        if: steps.scope.outputs.run == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref == 'production')
        run: ./tools/run-semantic-mutation-gate.sh complete --lane mutants

      - name: Preserve mutation evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-mutation-mutants-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/semantic-mutation.*/**
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  semantic-mutation:
    name: semantic mutation (${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production')) && 'changed' || 'complete' }})
    if: always()
    needs:
      - semantic-mutation-operators
      - semantic-mutation-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - name: Require complete operator-shard and mutants-lane evidence
        env:
          SEMANTIC_MUTATION_OPERATORS: ${{ needs.semantic-mutation-operators.result }}
          SEMANTIC_MUTATION_MUTANTS: ${{ needs.semantic-mutation-mutants.result }}
        shell: bash
        run: |
          failures=0
          for result in "$SEMANTIC_MUTATION_OPERATORS" "$SEMANTIC_MUTATION_MUTANTS"; do
            if [ "$result" != "success" ]; then
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "semantic mutation failed: operators=$SEMANTIC_MUTATION_OPERATORS mutants=$SEMANTIC_MUTATION_MUTANTS" >&2
            exit 1
          fi

      # Agent-configuration-exempt pull requests never upload shard
      # manifests (the upload steps above are gated on the same scope
      # check), so there is nothing to download or validate: the shards
      # already reported `success` from their early exit, which the
      # previous step accepted.
      - name: Download operator shard manifests
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: semantic-mutation-operators-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: semantic-mutation-operators

      - name: Verify operator shard completeness
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find semantic-mutation-operators -name shard-manifest.v1.json | sort)
          if [ "${#manifests[@]}" -ne 3 ]; then
            echo "semantic mutation: expected 3 operator shard manifests, found ${#manifests[@]}" >&2
            exit 1
          fi
          base_revision="$(jq -r '.base_revision' "${manifests[0]}")"
          table_operators="$(jq -c '.table_operators' "${manifests[0]}")"
          work="$(mktemp -d)"
          for index in "${!manifests[@]}"; do
            manifest="${manifests[$index]}"
            if [ "$(jq -r '.base_revision' "$manifest")" != "$base_revision" ]; then
              echo "semantic mutation: $manifest disagrees with ${manifests[0]} on base_revision" >&2
              exit 1
            fi
            if [ "$(jq -c '.table_operators' "$manifest")" != "$table_operators" ]; then
              echo "semantic mutation: $manifest disagrees with ${manifests[0]} on table_operators" >&2
              exit 1
            fi
            jq -r '.executed_operators[]' "$manifest" | sort -u >"$work/shard-$index.txt"
          done
          jq -r '.[]' <<<"$table_operators" | sort -u >"$work/full.txt"
          ./tools/check-shard-union.sh "$work/full.txt" "$work"/shard-*.txt

  # M13 deterministic finite-model agreement (#673). The report begins
  # incomplete and becomes complete only after every selected case and edge
  # executes, so a truncated shard cannot read green.
  fsl-logic:
    name: FSL Logic Test (${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production')) && 'pr' || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide required evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/check-product-gate-scope.sh >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # Restore-only against `rust workspace`'s own `rust-workspace` key, not a
          # dedicated `fsl-logic` key. This job's entire build is
          # `cargo test -p fslc-rust --test typed_agreement --locked`
          # (`tools/run-fsl-logic-test.sh:19-22`), one test target that is a strict
          # subset of what the `rust workspace` shards already build -- `Swatinem/rust-cache`
          # prunes workspace-member build artifacts at save time and keeps only external
          # dependency output (upstream `src/cleanup.ts`), so every lane's cache is
          # substantively "the same lockfile's external deps" regardless of which job
          # saved it; restoring `rust-workspace` here loses nothing this job needed a
          # dedicated key for. This removes the dedicated `fsl-logic` key from the shared
          # budget -- measured at 1,470,489,603 B (1.369 GiB) before this change -- once a
          # human deletes the now-orphaned entry. The first observed post-change run was the
          # scheduled FSL Logic Test job in push run 31565897267 attempt 1: it completed in 2m54s after
          # logging `Cache hit for: v0-rust-rust-workspace-Linux-x64-e8b3ee54-09fbaf53` at
          # 05:14:43Z and `Restored from cache key
          # "v0-rust-rust-workspace-Linux-x64-e8b3ee54-09fbaf53" full match: true.` at
          # 05:15:05Z. Run 31570480618 attempt 1 was a second observed full match, completing in 3m02s
          # after logging `Cache hit for:
          # v0-rust-rust-workspace-Linux-x64-e8b3ee54-09fbaf53` at 06:34:15Z and
          # `Restored from cache key "v0-rust-rust-workspace-Linux-x64-e8b3ee54-09fbaf53"
          # full match: true.` at 06:34:36Z. The former dedicated-key warm runs took
          # 2m48s / 2m53s / 2m51s on 2026-08-09/10/11; the full-match log, not duration,
          # is the evidence of the shared-key restore.
          shared-key: rust-workspace
          save-if: false
          workspaces: rust -> target

      - name: Run bounded pull-request generation
        if: steps.scope.outputs.run == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref != 'production'))
        run: ./tools/check-native-integration.sh fsl-logic pr

      - name: Run scheduled-volume generation
        if: steps.scope.outputs.run == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref == 'production')
        run: ./tools/check-native-integration.sh fsl-logic scheduled

      - name: Preserve FSL Logic evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fsl-logic-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/fsl-logic/*.json
          if-no-files-found: error
          retention-days: 14

  product-gate:
    name: product gate
    if: >-
      always() &&
      (
        (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
        github.base_ref == 'production' ||
        vars.FSL_OPTIMISTIC_CI != 'enabled'
      )
    needs:
      - rust-workspace
      - wasm
      - rust-native-z3
      - production-native-z3-linux
      - semantic-mutation
      - fsl-logic
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete product evidence
        env:
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          WASM: ${{ needs.wasm.result }}
          NATIVE_Z3: ${{ needs.rust-native-z3.result }}
          PRODUCTION_NATIVE_Z3_LINUX: ${{ needs.production-native-z3-linux.result }}
          SEMANTIC_MUTATION: ${{ needs.semantic-mutation.result }}
          FSL_LOGIC: ${{ needs.fsl-logic.result }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          failures=0
          for result in "$RUST_WORKSPACE" "$WASM" "$NATIVE_Z3"; do
            if [ "$result" != "success" ]; then
              failures=1
            fi
          done
          if [ "$BASE_REF" = "production" ] && [ "$PRODUCTION_NATIVE_Z3_LINUX" != "success" ]; then
            failures=1
          fi
          # Both tiers are required. On pull requests the job runs changed
          # generic mutants plus all curated controls; every other event runs
          # the complete accepted P2 scope.
          if [ "$SEMANTIC_MUTATION" != "success" ]; then
            failures=1
          fi
          if [ "$FSL_LOGIC" != "success" ]; then
            failures=1
          fi
          if [ "$failures" -ne 0 ]; then
            echo "product gate failed: rust=$RUST_WORKSPACE wasm=$WASM native-z3=$NATIVE_Z3 production-linux=$PRODUCTION_NATIVE_Z3_LINUX semantic-mutation=$SEMANTIC_MUTATION fsl-logic=$FSL_LOGIC" >&2
            exit 1
          fi
