name: site reference freshness

# Not product verification (docs/DESIGN-ci.md's sense: rust workspace / WASM / native Z3 /
# semantic mutation / FSL Logic Test). This gate protects a documentation artifact --
# docs/intro/language.{ja,en}.html and docs/intro/cli.{ja,en}.html, generated by
# tools/build_site_reference.py from docs/LANGUAGE.md / docs/LANGUAGE.ja.md / the frozen
# Python cli.py -- so it deliberately runs as its own workflow rather than inside either
# existing gate:
#
#   - ci.yml ("product gate") is Rust-native by contract (AGENTS.md: "The complete required
#     product gate has one Rust-native entrypoint and does not execute Python"). This check
#     needs the third-party `markdown` package and pytest; it must not join that `needs:` list.
#   - merge-readiness.yml's `automation-contracts` job deliberately stays stdlib-only with no
#     pytest and no third-party dependency (see its own comment in
#     tools/check-merge-readiness.sh). That is a dependency-contract objection, not a latency
#     one: measured, `automation-contracts` runs in ~5s against `core-contracts`'s ~45s critical
#     path, so adding this ~10s pip-install-plus-pytest step there would cost zero wall-clock on
#     merge-readiness.yml as a whole. The lane's purity, not its speed, is what this placement
#     protects.
#   - This workflow's own context, `site reference freshness`, IS a required status check in the
#     `main safety and CI` ruleset (.github/ruleset-contract.json), so a stale page does block the
#     merge. That is safe specifically because this workflow runs on every pull request with no
#     path filter (see the `on:` block below) -- unlike the deferred, FSL_OPTIMISTIC_CI-gated
#     contexts in docs/DESIGN-ci.md's "Product gate contract", it can never fail to report on an
#     ordinary pull request, so requiring it cannot deadlock one. docs/DESIGN-ci.md's "Ruleset
#     drift audit" audits this requirement against the live ruleset so it cannot silently regress.
#
# See docs/DESIGN-docs-site.md's D7 addendum for the full rationale and #630/#688.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-reference-freshness-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freshness:
    name: site reference freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately not pinned: test_site_reference_snapshot.py's own
      # test_argparse_help_normalization_is_python_version_independent, and a direct
      # cross-version measurement (CPython 3.9.6/markdown 3.9 vs. CPython 3.14.6/markdown
      # 3.10.2) that produced byte-identical generated pages, showed the generator's output is
      # independent of the markdown version. pyproject.toml's own dev extra is unpinned
      # ("markdown>=3") for the same reason -- this step now installs that extra directly
      # rather than paraphrasing it as a hand-typed package list.
      #
      # Installing the whole package, not just pytest/markdown, is required: the generator
      # (tools/build_site_reference.py) imports fslc.cli_help, and importing any fslc
      # submodule runs src/fslc/__init__.py, which imports parser/model/bmc/runtime/analysis
      # -- so the generator also needs lark and z3-solver, both declared in pyproject.toml's
      # core `dependencies`. A hand-maintained transitive list goes stale the next time
      # src/fslc/__init__.py grows an import (#689); deferring to pyproject.toml's own
      # declaration cannot go stale, because it is that declaration.
      - name: Install the generator's test dependencies
        run: pip install ".[dev]"

      - name: Check the generated site reference pages are fresh
        run: python3 -m pytest tests/test_site_reference_snapshot.py -v
