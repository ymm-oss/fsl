name: site reference freshness

# Not product verification (docs/design/DESIGN-ci.md's sense: rust workspace / WASM / native Z3 /
# semantic mutation / FSL Logic Test). This gate protects a documentation artifact --
# generated `docs/intro/language.{ja,en}.html` and `docs/intro/cli.{ja,en}.html`.
# The same required context also invokes a static parser for the hand-authored
# `docs/intro/index.{ja,en}.html` and `docs/intro/examples.{ja,en}.html` route.
# These remain separate documentation-artifact checks, so this workflow deliberately
# runs as its own workflow rather than inside either existing gate:
#
#   - ci.yml ("product gate") is Rust-native by contract (AGENTS.md: "The complete required
#     product gate has one Rust-native entrypoint and does not execute Python"). This check
#     needs the third-party `markdown` package and pytest; it must not join that `needs:` list.
#   - merge-readiness.yml's `automation-contracts` job deliberately stays stdlib-only with no
#     pytest and no third-party dependency (see its own comment in
#     tools/check-merge-readiness.sh). That is a dependency-contract objection, not a latency
#     one: measured, `automation-contracts` runs in ~5s against `core-contracts`'s ~45s critical
#     path, so adding this ~10s pip-install-plus-pytest step there would cost zero wall-clock on
#     merge-readiness.yml as a whole. The lane's purity, not its speed, is what this placement
#     protects.
#   - This workflow's own context, `site reference freshness`, IS a required status check in the
#     `main safety and CI` ruleset (.github/ruleset-contract.json), so a stale page does block the
#     merge. That is safe specifically because this workflow runs on every pull request with no
#     path filter (see the `on:` block below) -- unlike the deferred, FSL_OPTIMISTIC_CI-gated
#     contexts in docs/design/DESIGN-ci.md's "Product gate contract", it can never fail to report on an
#     ordinary pull request, so requiring it cannot deadlock one. docs/design/DESIGN-ci.md's "Ruleset
#     drift audit" audits this requirement against the live ruleset so it cannot silently regress.
#
# See docs/design/DESIGN-ci.md's “Site reference context scope” for the combined-context contract.
# docs/design/DESIGN-docs-site.md D7 remains the generated-reference rationale for #630/#688.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-reference-freshness-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freshness:
    name: site reference freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the two third-party packages these steps import: `markdown` (the generator,
      # tools/build_site_reference.py) and pytest. None of the steps below imports the
      # frozen Python `fslc` package, lark, or z3-solver: the CLI pages are generated from
      # rust/fslc/cli-contract.json (#1007), and the generator's last `fslc` import, an
      # unused `fslc.cli_help` helper, was removed in #1176. The specifiers mirror
      # pyproject.toml's dev extra. They are deliberately not pinned: a direct
      # cross-version measurement (CPython 3.9.6/markdown 3.9 vs. CPython 3.14.6/markdown
      # 3.10.2) produced byte-identical generated pages. If a step here starts importing
      # `fslc`, it fails with ModuleNotFoundError rather than passing on a partial install.
      - name: Install the generator's test dependencies
        run: pip install "pytest>=7" "markdown>=3"

      - name: Check examples explain deadlock-ignore commands
        run: python3 tools/check-example-deadlock-ignore.py

      - name: Check site reference, manual-route, and refresh contracts
        run: python3 -m pytest tests/test_site_reference_snapshot.py tests/test_site_manual_integrity.py tests/test_site_refresh_contract.py -v
