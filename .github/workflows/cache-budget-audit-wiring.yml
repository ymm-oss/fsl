name: cache budget audit wiring

# This is configuration-conformance evidence for cache-budget-audit.yml, not
# product verification in docs/design/DESIGN-ci.md's Rust/WASM/native-Z3 sense. It
# remains an unfiltered corroborating check for pull requests outside
# merge-readiness.yml's main-branch scope; merge readiness now supplies the
# required blocking property for main-bound changes (see issue #845).
#
# The install step names only what this job imports: pytest and PyYAML (the
# validator, .github/scripts/validate-cache-budget-audit-workflow.py, and its
# test). Neither imports the frozen Python `fslc` package, lark, or z3-solver,
# so installing the whole package is unnecessary (#1176). The specifiers mirror
# pyproject.toml's dev extra; a new import fails with ModuleNotFoundError
# rather than passing silently.
#
# This context remains non-required. Its pytest control is intentionally
# duplicated in merge readiness, where the live parser-backed audit makes a
# workflow-name collision block a main merge without changing the ruleset.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: cache-budget-audit-wiring-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: cache budget audit wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the workflow validator's test dependencies
        run: pip install "pytest>=7" "PyYAML>=6"

      - name: Calibrate cache budget audit workflow wiring
        run: python3 -m pytest tests/test_cache_budget_audit_workflow.py -v
