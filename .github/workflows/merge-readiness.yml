# SPDX-License-Identifier: Apache-2.0

name: merge readiness

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-compile:
    name: merge readiness / Rust compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Saving is restricted to non-pull-request events, matching every
          # `Swatinem/rust-cache` step in `ci.yml`. This workflow runs on every pull
          # request, so before this guard existed it saved a fresh ref-scoped cache on
          # every one of them -- measured at 15 open pull requests holding 29 entries /
          # about 1.90 GiB (roughly 134 MiB per pull request across this job and
          # `core-contracts` below) against the repository's shared 10 GiB budget. PR
          # #752 closed this same eviction path in `ci.yml` but left this workflow open,
          # so its accumulation kept crowding out `main`'s caches -- including the
          # `native Z3 4.16 (windows-latest)` cache, observed evicted to zero entries.
          # See docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target

      - name: Check the native-Z3-free Rust surface
        run: ./tools/check-merge-readiness.sh compile

  core-contracts:
    name: merge readiness / core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Saving is restricted to non-pull-request events, matching every
          # `Swatinem/rust-cache` step in `ci.yml`. This workflow runs on every pull
          # request, so before this guard existed it saved a fresh ref-scoped cache on
          # every one of them -- measured at 15 open pull requests holding 29 entries /
          # about 1.90 GiB (roughly 134 MiB per pull request across this job and
          # `rust-compile` above) against the repository's shared 10 GiB budget. PR
          # #752 closed this same eviction path in `ci.yml` but left this workflow open,
          # so its accumulation kept crowding out `main`'s caches -- including the
          # `native Z3 4.16 (windows-latest)` cache, observed evicted to zero entries.
          # See docs/DESIGN-ci.md, "Actions cache budget", and issue #747.
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: rust -> target

      - name: Check solver-independent contracts
        run: ./tools/check-merge-readiness.sh core

  automation-contracts:
    name: merge readiness / automation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single commit: the changelog
          # fragment checks below diff BASE_SHA...HEAD_SHA and read
          # CHANGELOG.md at both revisions (docs/DESIGN-changelog-fragments.md,
          # migration site 6).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test post-merge issue reconciliation
        run: ./tools/check-merge-readiness.sh automation

      - name: Check changelog fragments (control 1, control 4)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./tools/aggregate_changelog.sh check-pr

  merge-readiness:
    name: merge readiness
    if: always()
    needs:
      - rust-compile
      - core-contracts
      - automation-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every readiness lane
        env:
          RUST_COMPILE: ${{ needs.rust-compile.result }}
          CORE_CONTRACTS: ${{ needs.core-contracts.result }}
          AUTOMATION_CONTRACTS: ${{ needs.automation-contracts.result }}
        shell: bash
        run: |
          failures=0
          for result in "$RUST_COMPILE" "$CORE_CONTRACTS" "$AUTOMATION_CONTRACTS"; do
            if [ "$result" != "success" ]; then
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "merge readiness failed: compile=$RUST_COMPILE core=$CORE_CONTRACTS automation=$AUTOMATION_CONTRACTS" >&2
            exit 1
          fi
