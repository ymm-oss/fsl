<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSL ブラウザプレイグラウンド</title>
  <link rel="stylesheet" href="assets/site.css" />
  <script src="./coi-serviceworker.js"></script>
</head>
<body class="playground-page site-refreshed">
  <a class="skip-link" href="#main">メインコンテンツへスキップ</a>
  <main id="main" tabindex="-1">
  <h1>FSL ブラウザプレイグラウンド</h1>
  <p>検証は破棄可能な Web Worker 内でローカル実行します。キャンセルすると Worker と Z3 インスタンスを終了します。</p>
  <textarea id="fsl-source" spellcheck="false">spec BrowserCounter {
  type K = 0..1
  state { x: K }
  init { x = 0 }
  action increment() { requires x == 0 x = 1 }
  invariant Bounded { x &gt;= 0 and x &lt;= 1 }
}</textarea>
  <div><button id="fsl-verify">検証</button><button id="fsl-cancel" disabled>キャンセル</button><span id="fsl-progress">待機中</span></div>
  <pre id="fsl-output" aria-live="polite"></pre>
  </main>
  <script type="module" src="./playground.js"></script>
</body>
</html>
