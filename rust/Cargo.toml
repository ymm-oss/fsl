[workspace]
members = [
    "fsl-core",
    "fsl-lsp",
    "fsl-runtime",
    "fsl-solver",
    "fsl-solver-z3",
    "fsl-solver-z3js",
    "fsl-syntax",
    "fsl-tools",
    "fsl-verifier",
    "fsl-wasm",
    "fslc",
]
resolver = "2"

[workspace.package]
version = "4.12.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5"
sha2 = "0.10"
stacker = "0.1"
unicode-ident = "1.0"
unicode-normalization = "0.1"
unicode-security = "0.1"
z3 = { version = "=0.20.2", default-features = false, features = ["vendored", "z3_4_16"] }
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"

# `split-debuginfo` stays at each target's default: no value is stable on
# every CI target (Windows MSVC accepts only `packed`, wasm32 only `off`), and
# profiles cannot be scoped per target.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# z3-sys's build script compiles vendored Z3 through cmake-rs, which maps
# opt-level 0 to CMAKE_BUILD_TYPE=Debug (`-O0`, Z3's internal assertions and
# tracing). With opt-level 2 and debug = false it selects Release, the same
# Z3 configuration release builds ship.
[profile.dev.package.z3-sys]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
