[package]
name = "fsl-wasm"
description = "Browser Web Worker entry point for FSL verification"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fsl-core = { path = "../fsl-core" }
fsl-runtime = { path = "../fsl-runtime" }
fsl-solver = { path = "../fsl-solver" }
fsl-solver-z3js = { path = "../fsl-solver-z3js" }
fsl-syntax = { path = "../fsl-syntax" }
fsl-verifier = { path = "../fsl-verifier" }
fslc-rust = { path = "../fslc", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

# The Worker's requirements checks take their solver as a parameter; the
# native-host tests answer them with native Z3 (the browser bridge exists
# only in a Worker).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fsl-solver-z3 = { path = "../fsl-solver-z3" }

[lints]
workspace = true
