[package]
name = "fslc-rust"
description = "Native FSL command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fslc"
path = "src/main.rs"
required-features = ["native-cli"]

[features]
default = ["native-cli"]
native-cli = [
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:fsl-solver-z3",
    "dep:sha2",
]

[dependencies]
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
fsl-core = { path = "../fsl-core" }
fsl-runtime = { path = "../fsl-runtime" }
fsl-solver = { path = "../fsl-solver" }
fsl-solver-z3 = { path = "../fsl-solver-z3", optional = true }
fsl-syntax = { path = "../fsl-syntax" }
# Unconditional: `check_stages` (shared with the Worker) validates `dbsystem`
# and Agent documents through it (issue #1163).
fsl-tools = { path = "../fsl-tools" }
fsl-verifier = { path = "../fsl-verifier" }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
jsonschema = { version = "0.48.0", default-features = false }
libc = "0.2"
# `parse_entry_inventory.rs` reads the workspace's Rust sources as syntax
# trees, not text, so an alias, a function pointer, or a call inside a macro
# cannot hide a parse entry from the inventory.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[lints]
workspace = true
