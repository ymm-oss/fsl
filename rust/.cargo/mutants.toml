# cargo-mutants 27.1.0 configuration for the accepted P2 pilot.

examine_globs = [
  "fsl-verifier/src/bmc.rs",
  "fsl-verifier/src/trace.rs",
  "fslc/src/verification_output.rs",
]

examine_re = [
  "(replace verify_bounded_config( ->| with)| in verify_bounded_config$)",
  "(replace check_state_properties( ->| with)| in check_state_properties$)",
  "(replace make_violation( ->| with)| in make_violation$)",
  "(replace probe( ->| with)| in probe$)",
  "(replace project_trace( ->| with)| in project_trace$)",
  "(replace project_action( ->| with)| in project_action$)",
  "(replace replay_bmc_witnesses( ->| with)| in replay_bmc_witnesses$)",
  "(replace render_violation( ->| with)| in render_violation$)",
]

# These three line-scoped exclusions are coupled to unique source anchors by
# implementation_mutation_manifest.rs. Liveness is deliberately outside the
# initial P2 symbolic-witness pilot rather than being treated as equivalent.
exclude_re = [
  "^fsl-verifier/src/bmc\\.rs:420:.* in verify_bounded_config$",
  "^fsl-verifier/src/bmc\\.rs:427:.* in verify_bounded_config$",
  "^fsl-verifier/src/bmc\\.rs:451:.* in verify_bounded_config$",
]

# Changed-mode diff filtering may select only fsl-verifier as the mutated
# package. Select the workspace explicitly so the named detector targets are
# still resolved from fslc-rust instead of being applied to fsl-verifier.
test_workspace = true
additional_cargo_test_args = ["--test", "solver_fail_closed", "--test", "triangulated_assurance"]
timeout_multiplier = 3.0
build_timeout_multiplier = 3.0
minimum_test_timeout = 30.0
cap_lints = true
gitignore = true
copy_vcs = true
